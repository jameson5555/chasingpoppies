name: Deploy Website to FTP

on:
  workflow_dispatch:
  schedule:
    # Refresh static show listings daily at 3:17 AM Arizona time (UTC-7).
    - cron: '17 10 * * *'
  push:
    branches:
      - main
      - master

concurrency:
  group: deploy-website
  cancel-in-progress: false

jobs:
  web-deploy:
    name: Build and Deploy
    # Scheduled runs only use GitHub's free standard runners for public repos.
    if: ${{ github.event_name != 'schedule' || github.event.repository.visibility == 'public' }}
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 2
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install Dependencies
      run: npm install

    - name: Test Event Metadata
      run: npm test
      
    - name: Build Website
      run: npm run build
      env:
        YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}

    - name: List Build Artifacts
      run: ls -R ./dist
      
    - name: FTP Deploy
      uses: SamKirkland/FTP-Deploy-Action@v4.3.4
      with:
        server: ${{ secrets.FTP_SERVER }}
        username: ${{ secrets.FTP_USERNAME }}
        password: ${{ secrets.FTP_PASSWORD }}
        local-dir: ./dist/
        # Optional: Set this to your destination directory in cPanel (e.g. /public_html/)
        # server-dir: /public_html/
